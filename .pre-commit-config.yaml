repos:
  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: npx --no-install prettier --write
        language: system
        files: \.(js|jsx|ts|tsx|json|jsonc|css|scss|html|md|yaml|yml|astro)$
      - id: eslint
        name: ESLint
        entry: npx --no-install eslint
        language: system
        files: \.(js|jsx|ts|tsx|astro)$

  # Check for merge conflicts
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: trailing-whitespace
      - id: end-of-file-fixer

  # Validate Astro files
  - repo: https://github.com/withastro/pre-commit-astro
    rev: v0.1.0
    hooks:
      - id: astro-check
      - id: astro-sync
